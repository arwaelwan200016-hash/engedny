<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نقل بيانات انجدني</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f8ff;color:#16305c;display:grid;min-height:100vh;place-items:center}.card{width:min(560px,88vw);background:#fff;padding:32px;border-radius:22px;box-shadow:0 14px 45px #1f5bb520}h1{margin-top:0;color:#1665d8}p{line-height:1.8;color:#526b92}textarea{box-sizing:border-box;width:100%;min-height:130px;border:1px solid #cbd9f2;border-radius:12px;padding:12px;font:14px monospace;direction:ltr}button{margin-top:16px;border:0;border-radius:10px;background:#1768e8;color:#fff;padding:13px 24px;font-size:16px;font-weight:bold;cursor:pointer}#result{margin-top:16px;padding:12px;border-radius:10px;background:#eef5ff;display:none}.ok{color:#087c48}.error{color:#c23838}</style><main class="card"><h1>نقل بيانات انجدني إلى Supabase</h1><p>الصقي رابط الاتصال الكامل بعد استبدال <code>[YOUR-PASSWORD]</code> بكلمة المرور. لا ترسليه لأي شخص.</p><textarea id="url" placeholder="postgresql://postgres..."></textarea><button id="go">نقل البيانات الآن</button><div id="result"></div></main><script>const b=document.querySelector('#go'),u=document.querySelector('#url'),r=document.querySelector('#result');b.onclick=async()=>{b.disabled=true;r.style.display='block';r.className='';r.textContent='جارٍ نقل البيانات...';try{const x=await fetch('/api/local/import-supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({connectionString:u.value})});const d=await x.json();if(!x.ok)throw Error(d.error||'تعذر النقل');r.className='ok';r.textContent='تم نقل البيانات بنجاح. يمكنك إغلاق هذه الصفحة.';u.value=''}catch(e){r.className='error';r.textContent=e.message}finally{b.disabled=false}};</script></html>
